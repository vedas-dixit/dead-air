<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-text="listen.page.title">Dead Air</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  </head>
  <body class="listen-page">
    <!--look:header-->
    <main>
      <h1 class="sr-only" data-text="listen.page.heading"></h1>

      <div id="error-line" role="alert"></div>

      <!-- The receiver: grille, lamp and state, then the notes that belong to listening. -->
      <div class="receiver">
        <div id="level-meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label=""></div>
        <div class="state-line">
          <span id="listening-lamp" class="lamp" hidden></span>
          <div id="state-line" aria-live="polite"></div>
        </div>
        <div id="unreadable-line" aria-live="polite"></div>
        <div id="keep-open-line"></div>
        <div id="history-unkept-line"></div>
        <div id="pass-status-line" aria-live="polite" hidden></div>
        <div id="pass-volume-line" hidden></div>
        <div id="pass-error-line" role="alert" hidden></div>
        <div id="start-reason-line" hidden></div>
        <div class="action-bar">
          <button id="btn-start" type="button" data-text="listen.btn.start"></button>
          <button id="btn-stop" type="button" data-text="listen.btn.stop"></button>
          <button id="btn-pass-stop" type="button" data-text="listen.pass.stop" hidden></button>
        </div>
      </div>

      <div id="cards"></div>

      <div class="listen-foot">
        <fieldset id="alert-settings">
          <legend data-text="listen.settings.heading"></legend>
          <div class="switch-row">
            <input id="set-flash" type="checkbox" role="switch" />
            <label for="set-flash" data-text="listen.setting.flash"></label>
          </div>
          <div id="set-vibrate-row" class="switch-row">
            <input id="set-vibrate" type="checkbox" role="switch" />
            <label for="set-vibrate" data-text="listen.setting.vibrate"></label>
          </div>
        </fieldset>
        <button id="btn-clear" type="button" data-text="listen.btn.clear"></button>
        <div id="offline-line" aria-live="polite"></div>
        <p id="storage-note" aria-live="polite" hidden></p>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
